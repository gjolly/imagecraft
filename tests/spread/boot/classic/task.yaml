summary: Boot classic image in QEMU

systems: [ubuntu-24.04-64, ubuntu-24.04-arm-64]

environment:
  ROOT_FS/ext4: ext4
  ROOT_FS/btrfs: btrfs

prepare: |
  ARCH=$(dpkg --print-architecture)
  if [ "$ARCH" = "amd64" ]; then
    tests.pkgs install qemu-system-x86 ovmf
  elif [ "$ARCH" = "arm64" ]; then
    tests.pkgs install qemu-system-arm qemu-efi-aarch64
  else
    echo "Unsupported arch: $ARCH"
    exit 1
  fi

execute: |
  if [ "$ROOT_FS" = "btrfs" ]; then
    cp imagecraft.yaml imagecraft.yaml.backup
    python3 - <<'PY'
  import yaml
  from pathlib import Path

  path = Path("imagecraft.yaml")
  project = yaml.safe_load(path.read_text())
  structure = project["volumes"]["pc"]["structure"]
  structure[-1]["filesystem"] = "btrfs"
  structure.insert(1, {
      "name": "boot",
      "type": "0FC63DAF-8483-4772-8E79-3D69D8477DE4",
      "filesystem": "ext4",
      "role": "system-boot",
      "size": "1G",
  })
  project["filesystems"]["default"].insert(1, {
      "mount": "/boot", "device": "(volume/pc/boot)",
  })
  project["parts"]["rootfs"]["mmdebstrap-packages"].append("btrfs-progs")
  project["parts"]["fstab"]["overlay-script"] = project["parts"]["fstab"]["overlay-script"].replace(
      "ext4\tdiscard,errors=remount-ro\t0\t1", "btrfs\tdefaults\t0\t0"
  )
  project["parts"]["sentinel-service"]["override-overlay"] = project["parts"]["sentinel-service"]["override-overlay"].replace(
      "echo HELLO FROM IMAGECRAFT",
      r"test \$(findmnt -n -o FSTYPE /) = btrfs && test \$(findmnt -n -o FSTYPE /boot) = ext4 && echo HELLO FROM IMAGECRAFT",
  )
  path.write_text(yaml.safe_dump(project, sort_keys=False))
  PY
  fi
  imagecraft pack --destructive-mode

  ARCH=$(dpkg --print-architecture)
  if [ "$ARCH" = "amd64" ]; then
    QEMU_BIN="qemu-system-x86_64"
    QEMU_ARGS=""
    UEFI_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
    UEFI_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd
  elif [ "$ARCH" = "arm64" ]; then
    QEMU_BIN="qemu-system-aarch64"
    QEMU_ARGS="-machine virt -cpu neoverse-n1"
    UEFI_CODE=/usr/share/AAVMF/AAVMF_CODE.fd
    UEFI_VARS=/usr/share/AAVMF/AAVMF_VARS.fd
  else
    echo "Unsupported arch: $ARCH"
    exit 1
  fi

  cp "$UEFI_VARS" /tmp/uefi_vars.fd

  $QEMU_BIN \
    $QEMU_ARGS \
    -accel kvm -accel tcg,thread=multi \
    -smp "$(nproc)" \
    -nographic \
    -m 1G \
    -drive if=pflash,format=raw,readonly=on,file=$UEFI_CODE \
    -drive if=pflash,format=raw,file=/tmp/uefi_vars.fd \
    -drive file=pc.img,format=raw,index=0,if=virtio 2>&1 | tee output.log || true

  MATCH "HELLO FROM IMAGECRAFT" output.log

restore: |
  imagecraft clean --destructive-mode || true
  if [ -f imagecraft.yaml.backup ]; then
    mv imagecraft.yaml.backup imagecraft.yaml
  fi
  rm -f pc.img output.log /tmp/uefi_vars.fd

debug: |
  cat output.log 2>/dev/null || echo "No serial output log"
